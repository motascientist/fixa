plugins {
    id 'com.android.application'
}

// The APK has no app code of its own: it packs the web app (the parent folder) and opens it from inside the file.
def webApp = rootProject.file('..')
// The signing key never goes into the repository: it comes from environment variables (see README.md).
def keystore = System.getenv('FIXA_KEYSTORE')

android {
    namespace 'app.fixa'
    compileSdk 34

    defaultConfig {
        applicationId 'app.fixa'
        minSdk 27
        targetSdk 34
        versionCode 5
        versionName '0.2.0'
    }

    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv('FIXA_KEYSTORE_PASSWORD')
                keyAlias 'fixa'
                keyPassword System.getenv('FIXA_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main { assets.srcDirs = ["$buildDir/webapp"] }
    }

    lint { checkReleaseBuilds false }
}

tasks.register('copyWebApp', Copy) {
    from(webApp) {
        include 'index.html', 'style.css', 'i18n.js', 'app.js', 'fsrs.js', 'media.js', 'manifest.webmanifest', 'icons/**'
    }
    into "$buildDir/webapp"
}
preBuild.dependsOn copyWebApp
